services:
  tdx-api:
    build:
      context: .
    image: tdx-api:local
    restart: unless-stopped
    ports:
      - "${TDX_API_PORT:-8080}:8080"
    environment:
      TDX_HTTP_ADDR: ":8080"
      TDX_HOSTS: "${TDX_HOSTS:-}"
      TDX_POOL_SIZE: "${TDX_POOL_SIZE:-1}"
      TDX_EXHQ_HOSTS: "${TDX_EXHQ_HOSTS:-}"
      TDX_EXHQ_POOL_SIZE: "${TDX_EXHQ_POOL_SIZE:-1}"
      TDX_DIAL_TIMEOUT: "${TDX_DIAL_TIMEOUT:-5s}"
      TDX_SHUTDOWN_TIMEOUT: "${TDX_SHUTDOWN_TIMEOUT:-10s}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    stop_grace_period: 15s
